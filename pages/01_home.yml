  - name: Home
    head-widgets:
      - type: search
        hide-header: true
        placeholder: "!yt; !im"
        autofocus: true
        new-tab: true
        search-engine: duckduckgo
        bangs:
        - title: YouTube
          shortcut: "!yt"
          url: https://www.youtube.com/results?search_query={QUERY}
        - title: IMDb
          shortcut: "!im"
          url: https://www.imdb.com/find/?q={QUERY}

    # width: slim
    center-vertically: true
    columns:
    - size: small
      widgets:
        - type: bookmarks
          hide-header: true
          groups:
            - title: Mail
              color: 200 50 50
              hide-arrow: true
              links:
                - title: Gmail
                  url: https://gmail.com
                  icon: ../assets/icons/gmail.png
                - title: Proton
                  url: https://mail.proton.me
                  icon: ../assets/icons/proton-mail.png
            - title: Resources
              hide-arrow: true
              color: 100 25 75
              links:
                - title: Google Drive
                  url: https://drive.google.com
                  icon: ../assets/icons/google-drive.png
                - title: ChatGPT
                  url: https://chat.openai.com
                  icon: ../assets/icons/chatgpt.png
                - title: Claude
                  url: https://claude.ai
                  icon: ../assets/icons/claude.png
                - title: Karvec's OpenWebUI
                  url: https://openwebui.maybeits.us
                  icon: sh:open-webui-dark.png
                  description: Local LLMs 
            - title: Entertainment
              color: 10 70 50
              hide-arrow: true
              links:
                - title: YouTube
                  url: https://youtube.com
                  icon: ../assets/icons/youtube.png
                - title: Netflix
                  url: https://netflix.com
                  icon: ../assets/icons/netflix.png
                - title: Podcasts
                  url: https://pocketcasts.com/
                  icon: ../assets/icons/pocket-casts.png
                - title: Scribble.rs
                  url: https://scribble.devboer.com # http://10.0.50.2:6969/
                  icon: ../assets/icons/excalidraw.png
                - title: Karvec's Jellyfin
                  url: https://jellyfin.maybeits.us
                  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyfin.png # ../assets/icons/jellyfin.png
                - title: Request (Karvec)
                  url: https://jellyseerr.maybeits.us/
                  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyseerr.png # ../assets/icons/jellyseerr.png

    - size: full
      widgets:          
        - type: monitor
          show-failing-only: false
          cache: 1m
          title: Media
          sites:
            - title: Jellyfin (Netflix alt)
              url: https://${JELLYFIN_HOST}.${INT}
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyfin-light.png # ../assets/icons/jellyfin-light.png
            - title: Immich (Google Photos alt)
              url: https://${IMMICH_HOST}.${INT}
              icon: ../assets/icons/immich.png
            - title: Kima-Hub (Spotify alt)
              url: https://kimahub.${ARR}
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/kima-hub.png
            - title: FreshRSS (News Reader)
              url: https://${FRESHRSS_HOST}.${INT}
              icon: ../assets/icons/freshrss.png
            - title: Seerr (Discover Movies/TV)
              url: https://${SEERR_HOST}.${ARR}
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/seerr.png # ../assets/icons/jellyseerr-light.png
            - title: Shelfmark (Discover Books)
              url: https://shelfmark.arr.devboer.com
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/shelfmark.png

        - type: monitor
          show-failing-only: false
          cache: 1m
          title: Household
          sites:
          # Screwed up HASS because I didn't back it up and chose to fake remove for joining main cluster node
            - title: Home Assistant
              url: https://${HASS_HOST}.${IOT}
              icon: ../assets/icons/home-assistant.png
            # This link is nice for editing/viewing/scrubbing footage however can it be part of HASS?  
            - title: Doorbell
              url: ${DOORBELL_IP}
              icon: ../assets/icons/reolink.png
              allow-insecure: true
            - title: Mealie (Recipes, Planning)
              url: https://${MEALIE_HOST}.${INT}
              icon: sh:mealie
            - title: Warracker (Warranty Tracker)
              url: https://${WARRACKER_HOST}.${OC}
              icon: sh:warracker

           # I have yet to set this up and see if this my prefered solution for iCloud replacement   
           # - title: Files
           #   url: https://${OPENCLOUD_HOST}.${INT}
           #   icon: ../assets/icons/opencloud.png
           #   allow-insecure: true
 
        - type: monitor
          show-failing-only: false
          cache: 1m
          title: Office
          sites:
            - title: BentoPDF
              url: http://10.0.40.39:8080
              icon: sh:bentopdf

          # Needs database fixing after failed migration
          #  - title: Hoard Websites
          #    url: https://${KARAKEEP_HOST}.${INT}
          #    icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/karakeep-light.png # ../assets/icons/karakeep-light.png
            # Needs further setup ^ why does it lock me out after initial setup?  
            - title: Jotty*Page
              url: https://${JOTTY_HOST}.${INT}
              icon: sh:jotty
            - title: ConvertX ( …Files)
              url: ${CONVERTX_IP}
              icon: ../assets/icons/convertx.png
            - title: LinkStack (Linktree alt)
              url: https://linkstack.${OC}
              icon: ../assets/icons/linkstack.png
            - title: Linkding
              url: https://links.${OC}
              icon: sh:linkding
            - title: RxResumé
              url: https://${RXRESUME_HOST}.${INT}
              icon: ../assets/icons/reactive-resume-light.png
            - title: Gitea (GitHub alt)
              url: https://${GITEA_HOST}.${INT}
              icon: ../assets/icons/gitea.png
           
        - type: custom-api
          title: Random Fact
          cache: 3h
          url: https://uselessfacts.jsph.pl/api/v2/facts/random
          template: |
            <p class="size-h4 color-paragraph">{{ .JSON.String "text" }}</p>
