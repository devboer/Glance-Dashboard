  - name: Home
    head-widgets:
      - type: search
        hide-header: true
        placeholder: " web search or ! + yt imdb ... "
        autofocus: true
        new-tab: true
        search-engine: duckduckgo
        bangs:
        - title: YouTube
          shortcut: "!yt"
          url: https://www.youtube.com/results?search_query={QUERY}
        - title: IMDb
          shortcut: "!imdb"
          url: https://www.imdb.com/find/?q={QUERY}
        - title: PornHub
          shortcut: "!ph"
          url: https://www.pornhub.com/video/search?search={QUERY}
        - title: IMDb
          shortcut: "!im"
          url: https://www.imdb.com/find/?q={QUERY}
        - title: The Pirate Bay
          shortcut: "!tpb"
          url: https://thepiratebay.org/search.php?q={QUERY}
        - title: Dashboard Icons
          shortcut: "!di"
          url: https://dashboardicons.com/icons?q={QUERY}
        - title: Simple Icons
          shortcut: "!si"
          url: https://simpleicons.org/?q={QUERY}
    # width: slim
    center-vertically: true
    columns:
    - size: small
      widgets:
        - type: bookmarks
          hide-header: true
          groups:
            - title: Mail
              color: 200 50 50
              hide-arrow: true
              links:
                - title: Gmail
                  url: https://gmail.com
                  icon: ../assets/icons/gmail.png
                - title: Proton
                  url: https://mail.proton.me
                  icon: ../assets/icons/proton-mail.png
            - title: Resources
              hide-arrow: true
              color: 100 25 75
              links:
                - title: Google Drive
                  url: https://drive.google.com
                  icon: ../assets/icons/google-drive.png
                - title: ChatGPT
                  url: https://chat.openai.com
                  icon: ../assets/icons/chatgpt.png
                - title: Claude
                  url: https://claude.ai
                  icon: ../assets/icons/claude.png
                - title: Karvec's OpenWebUI
                  url: https://openwebui.maybeits.us
                  icon: sh:open-webui-dark.png
                  description: Local LLMs 
            - title: Entertainment
              color: 10 70 50
              hide-arrow: true
              links:
                - title: YouTube
                  url: https://youtube.com
                  icon: ../assets/icons/youtube.png
                - title: Netflix
                  url: https://netflix.com
                  icon: ../assets/icons/netflix.png
                - title: Podcasts
                  url: https://pocketcasts.com/
                  icon: ../assets/icons/pocket-casts.png
                - title: Scribble.rs
                  url: https://scribble.devboer.com # http://10.0.50.2:6969/
                  icon: ../assets/icons/excalidraw.png
                - title: Karvec's Jellyfin
                  url: https://jellyfin.maybeits.us
                  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyfin.png # ../assets/icons/jellyfin.png
                - title: Karvec's Jellyseerr
                  url: https://jellyseerr.maybeits.us/
                  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyseerr.png # ../assets/icons/jellyseerr.png

    - size: full
      widgets:          
        - type: bookmarks
          hide-header: true
          groups:
           - title: Media
             color: 10 70 50
             hide-arrow: true
             links:
               - title: Jellyfin
                 url: https://jellyfin.${INT}
                 icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyfin-light.png
                 description: Stream movies, series, memories, and music.
               - title: Immich
                 url: https://photos.${INT}
                 icon: ../assets/icons/immich.png
                 description: View photos and videos of memories.
               - title: Kima Hub
                 url: https://kimahub.${ARR}
                 icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/kima-hub.png
                 description: Discover & listen to music, audiobooks, or podcasts.        - title: FreshRSS
                 url: https://rss.${INT}
                 icon: ../assets/icons/freshrss.png
                 description: Read your news, reddits, and blogs.
               - title: Seerr
                 url: https://${SEERR_HOST}.${ARR}
                 icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/seerr.png # ../assets/icons/jellyseerr-light.png
                 description: Request movies and series (soon™️ music)
               - title: Shelfmark
                 url: https://shelfmark.arr.devboer.com
                 icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/shelfmark.png
                 description: Search & download books and audiobooks.
               - title: Yamtrack
                 url: http://10.0.40.67:8000
                 icon: sh:yamtrack
                 description: Track any content you want to do or done.            
               - title: Romm
                 url: http://10.0.40.22
                 icon: sh:romm
                 description: Retro games and emulators hosted here.

        - type: monitor
          show-failing-only: false
