              icon: ../assets/icons/reolink.png
              allow-insecure: true
            - title: Meal Planning
              url: https://${MEALIE_HOST}.${INT}
              icon: sh:mealie
            - title: Warranty Tracker
              url: https://${WARRACKER_HOST}.${OC}
              icon: sh:warracker
 
