  - name: Home
    head-widgets:
      - type: search
        hide-header: true
        placeholder: " web search or ! + yt imdb ... "
        autofocus: true
        new-tab: true
        search-engine: duckduckgo
        bangs:
        - title: YouTube
          shortcut: "!yt"
          url: https://www.youtube.com/results?search_query={QUERY}
        - title: IMDb
          shortcut: "!imdb"
          url: https://www.imdb.com/find/?q={QUERY}
        - title: PornHub
          shortcut: "!ph"
          url: https://www.pornhub.com/video/search?search={QUERY}
        - title: IMDb
          shortcut: "!im"
          url: https://www.imdb.com/find/?q={QUERY}
        - title: The Pirate Bay
          shortcut: "!tpb"
          url: https://thepiratebay.org/search.php?q={QUERY}
        - title: Dashboard Icons
          shortcut: "!di"
          url: https://dashboardicons.com/icons?q={QUERY}
        - title: Simple Icons
          shortcut: "!si"
          url: https://simpleicons.org/?q={QUERY}
    # width: slim
    center-vertically: true
    columns:
    - size: small
      widgets:
        - type: bookmarks
          hide-header: true
          groups:
            - title: Mail
              color: 200 50 50
              hide-arrow: true
              links:
                - title: Gmail
                  url: https://gmail.com
                  icon: ../assets/icons/gmail.png
                - title: Proton
                  url: https://mail.proton.me
                  icon: ../assets/icons/proton-mail.png
            - title: Resources
              hide-arrow: true
              color: 100 25 75
              links:
                - title: Google Drive
                  url: https://drive.google.com
                  icon: ../assets/icons/google-drive.png
                - title: ChatGPT
                  url: https://chat.openai.com
                  icon: ../assets/icons/chatgpt.png
                - title: Claude
                  url: https://claude.ai
                  icon: ../assets/icons/claude.png
                - title: Karvec's OpenWebUI
                  url: https://openwebui.maybeits.us
                  icon: sh:open-webui-dark.png
                  description: Local LLMs 
            - title: Entertainment
              color: 10 70 50
              hide-arrow: true
              links:
                - title: YouTube
                  url: https://youtube.com
                  icon: ../assets/icons/youtube.png
                - title: Netflix
                  url: https://netflix.com
                  icon: ../assets/icons/netflix.png
                - title: Podcasts
                  url: https://pocketcasts.com/
                  icon: ../assets/icons/pocket-casts.png
                - title: Scribble.rs
                  url: https://scribble.devboer.com # http://10.0.50.2:6969/
                  icon: ../assets/icons/excalidraw.png
                - title: Karvec's Jellyfin
                  url: https://jellyfin.maybeits.us
                  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyfin.png # ../assets/icons/jellyfin.png
                - title: Karvec's Jellyseerr
                  url: https://jellyseerr.maybeits.us/
                  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyseerr.png # ../assets/icons/jellyseerr.png

    - size: full
      widgets:          
