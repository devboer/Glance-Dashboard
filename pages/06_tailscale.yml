  - name: Tailnet
    head-widgets:
      - type: search
        hide-header: true
        placeholder: " web search or ! + yt imdb ... "
        autofocus: true
        new-tab: true
        search-engine: duckduckgo # ${DEGOOG_IP}/search?q={QUERY}
        bangs:
        - title: YouTube
          shortcut: "!yt"
          url: https://www.youtube.com/results?search_query={QUERY}
        - title: IMDb
          shortcut: "!imdb"
          url: https://www.imdb.com/find/?q={QUERY}
        - title: PornHub
          shortcut: "!ph"
          url: https://www.pornhub.com/video/search?search={QUERY}
        - title: IMDb
          shortcut: "!im"
          url: https://www.imdb.com/find/?q={QUERY}
        - title: The Pirate Bay
          shortcut: "!tpb"
          url: https://thepiratebay.org/search.php?q={QUERY}
        - title: Dashboard Icons
          shortcut: "!di"
          url: https://dashboardicons.com/icons?q={QUERY}
        - title: Simple Icons
          shortcut: "!si"
          url: https://simpleicons.org/?q={QUERY}

    center-vertically: false
    columns:
    - size: small
      widgets:
        - type: bookmarks
          title: Admin Controls
          groups:
            - title: Network Controls
              color: 60 100 60
              hide-arrow: true
              links:
                - title: Router
                  url: ${OPNSENSE_TN} # https://opn.${TN}
                  icon: ../assets/icons/opnsense-v1.png
                - title: Travel Router
                  url: ${TRAVEL_ROUTER_TN}
                  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/gl-inet.png
                # - title: WiFi
                #   url: https://wifi.${TN} # https://wifi.${TN}
                #   icon: ../assets/icons/omada.png
                # - title: DNS01
                #   url: https://dns1.${TN} # https://dns1.${TN}
                #   icon: ../assets/icons/pi-hole.png
             
            - title: Backend Controls
              color: 60 100 60
              hide-arrow: true
              links:
                - title: PVE-Prod
                  url: ${PVEPROD_TN} # https://pve01.${TN}
                  icon: ../assets/icons/proxmox.png
                  allow-insecure: true
                - title: PVE-Prod Files
                  url: ${PVEPROD_FILES_TN}
                  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/filebrowser-quantum.png
                - title: PVE-Prod MenuX
                  url: ${PVEPROD_MENUX_TN}
                  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/proxmenu.png
