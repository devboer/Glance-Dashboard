            - type: releases
              cache: 1d
              # Without authentication the Github API allows for up to 60 requests per hour. You can create a
              # read-only token from your Github account settings and use it here to increase the limit.
              token: ${GH_TOKEN} # indefinite key *WARNING*
              show-source-icon: true
              repositories:
                - glanceapp/glance                    # Glance Dashboard
                - immich-app/immich                   # Photos Backup and Management
                - opnsense/core                       # Firewall and Router Software
                - home-assistant/core                 # Home Automation and Dashboard
                - paperless-ngx/paperless-ngx         # Paperwork/Records Organization & Auto Ingest
             #   - winblues/blue95
                - scandum/tintin                      # MUD Client and Coding Language
                - monetr/monetr                       # Budget Money App that I am paying $4/mo
                - gohugoio/hugo                       # Static Website Generator, using for docs and blog
             #   - morph027/pve-lxc-scripts
                - community-scripts/ProxmoxVE         # Scripts by tteck for PVE continued by community
                - bookstackapp/bookstack              # Internal Documentation Service
                - release-argus/argus                 # Functionally the same as this widget but >Github
                - louislam/dockge                     # Docker Compose stack manager
                - coder/code-server                   # VS Code in the browser
                - cryptpad/cryptpad                   # Browser based Office 365
                - sabre-io/baikal                     # Backend CalDAV and CarDAV for Calendar and Contacts
                - freshrss/freshrss                   # RSS News Agregator
                - jellyfin/jellyfin                   # Movie/TV Streaming    :: SERVARR
                - fallenbagel/jellyseerr              # Request new media     :: SERVARR
                - lidarr/lidarr                       # Music Management      :: SERVARR
                - sonarr/sonarr                       # TV Series Management  :: SERVARR
                - radarr/radarr                       # Movies Management     :: SERVARR
                - cleanuparr/cleanuparr               # Clean up              :: SERVARR
                - prowlarr/prowlarr                   # Index Management      :: SERVARR
                - morpheus65535/bazarr                # Subtitles Downloader  :: SERVARR
                - sabnzbd/sabnzbd                    # Usenet NZB Downloader :: SERVARR
                - HaveAGitGat/Tdarr                   # Automated Transcoder  :: SERVARR
                - sbondCo/Watcharr                    # Watchlist             :: SERVARR
                - Whisparr/Whisparr                   # Porn Management       :: SERVARR
                - kapowarr/kapowarr                   # Comics Management     :: SERVARR
                - Kareadita/Kavita                    # Books Library
                - alexta69/metube                     # Grab any public vid   :: SERVARR
                - navidrome/navidrome                 # Music Streaming
                - chrisbenincasa/tunarr               # Create TV Stations    :: SERVARR
                - plexguide/Huntarr.io                # Seeks to upgrade lib  :: SERVARR
  
            - type: custom-api
              title: Steam Specials
              cache: 12h
              url: https://store.steampowered.com/api/featuredcategories?cc=us
              template: |
                <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                {{ range .JSON.Array "specials.items" }}
                <li>
                  <a class="size-h4 color-highlight block text-truncate" href="https://store.steampowered.com/app/{{ .Int "id" }}/">{{ .String "name" }}</a>
                <ul class="list-horizontal-text">
                <li>{{ div (.Int "final_price" | toFloat) 100 | printf "$%.2f" }}</li>
                {{ $discount := .Int "discount_percent" }}
                <li>{{ if ge $discount 40 }} class="color-positive"{{ end }}>{{ $discount }}% off</li>
                </ul>
                </li>
                {{ end }}
                </ul>
  
